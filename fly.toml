app = "vera-message-composer"
primary_region = "ord"

[env]
ANTHROPIC_API_KEY = ""

[build]
builder = "paketobuildpacks"

[[services]]
internal_port = 8000
processes = ["app"]
protocol = "tcp"
script_checks = []

  [services.concurrency]
  hard_limit = 25
  soft_limit = 20

  [[services.ports]]
  handlers = ["http"]
  port = 80

  [[services.ports]]
  handlers = ["tls", "http"]
  port = 443

  [services.tcp_checks]
  enabled = true
  grace_period = "5s"
  interval = "15s"
  timeout = "10s"

[[statics]]
guest_path = "/app/static"
url_prefix = "/static"
